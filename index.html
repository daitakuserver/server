<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>daitakuサーバー</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-cyan-200 via-sky-100 to-green-100 text-gray-800 font-sans">

  <!-- Hero -->
  <section class="text-center py-24 px-6">
    <div class="inline-block bg-white/70 backdrop-blur-md rounded-3xl px-8 py-6 shadow-2xl border border-white/50">
      <h1 class="text-5xl md:text-7xl font-extrabold text-cyan-600">
        daitakuサーバーへようこそ！
      </h1>

      <p class="mt-6 text-lg md:text-2xl text-gray-700 max-w-3xl mx-auto leading-relaxed">
        みんなで楽しく遊べるMinecraftマルチサーバー！<br>
        建築・冒険・サバイバルを楽しもう！
      </p>
    </div>
  </section>

  <!-- Cards -->
  <section class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-8 pb-16">

    <!-- IP -->
    <div class="bg-white/70 backdrop-blur-md rounded-3xl p-8 shadow-xl border border-cyan-200">
      <h2 class="text-3xl font-bold text-cyan-600 mb-6">
        サーバーIP
      </h2>

      <div class="space-y-5 text-lg">

        <!-- JAVA -->
        <div>
          <p class="font-semibold">JAVA版サーバーIP</p>

          <div class="mt-2 flex gap-2">
            <input
              id="javaip"
              value="companies-memorial.gl.joinmc.link"
              readonly
              class="flex-1 bg-cyan-50 rounded-2xl p-4 border border-cyan-200 text-cyan-700 font-mono"
            >

            <button
              onclick="copyText('javaip')"
              class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 rounded-2xl font-bold transition"
            >
              コピー
            </button>
          </div>
        </div>

        <!-- BEDROCK IP -->
        <div>
          <p class="font-semibold">統合版サーバーIP</p>

          <div class="mt-2 flex gap-2">
            <input
              id="bedrockip"
              value="companies-memorial.gl.at.ply.gg"
              readonly
              class="flex-1 bg-cyan-50 rounded-2xl p-4 border border-cyan-200 text-cyan-700 font-mono"
            >

            <button
              onclick="copyText('bedrockip')"
              class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 rounded-2xl font-bold transition"
            >
              コピー
            </button>
          </div>
        </div>

        <!-- BEDROCK PORT -->
        <div>
          <p class="font-semibold">統合版ポート番号</p>

          <div class="mt-2 flex gap-2">
            <input
              id="bedrockport"
              value="64686"
              readonly
              class="flex-1 bg-cyan-50 rounded-2xl p-4 border border-cyan-200 text-cyan-700 font-mono"
            >

            <button
              onclick="copyText('bedrockport')"
              class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 rounded-2xl font-bold transition"
            >
              コピー
            </button>
          </div>
        </div>

        <!-- Friend -->
        <div>
          <p class="font-semibold">フレンド追加（スイッチはこれ）</p>

          <div class="mt-2 flex gap-2">
            <input
              id="friendid"
              value="daitaku1563"
              readonly
              class="flex-1 bg-cyan-50 rounded-2xl p-4 border border-cyan-200 text-cyan-700"
            >

            <button
              onclick="copyText('friendid')"
              class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 rounded-2xl font-bold transition"
            >
              コピー
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Info -->
    <div class="bg-white/70 backdrop-blur-md rounded-3xl p-8 shadow-xl border border-green-200">
      <h2 class="text-3xl font-bold text-green-600 mb-6">
        サーバー情報
      </h2>

      <div class="space-y-5 text-lg">

        <!-- Version -->
        <div>
          <p class="font-semibold">サーバーバージョン</p>

          <div class="mt-2 bg-green-50 rounded-2xl p-4 border border-green-200 text-green-700">
            1.21.11
          </div>
        </div>

        <!-- Seed -->
        <div>
          <p class="font-semibold">シード値</p>

          <div class="mt-2 flex gap-2">
            <input
              id="seedvalue"
              value="2530241957734278106"
              readonly
              class="flex-1 bg-green-50 rounded-2xl p-4 border border-green-200 text-green-700 font-mono"
            >

            <button
              onclick="copyText('seedvalue')"
              class="bg-green-500 hover:bg-green-600 text-white px-5 rounded-2xl font-bold transition"
            >
              コピー
            </button>
          </div>
        </div>

        <!-- Gamemode -->
        <div>
          <p class="font-semibold">ゲームモード</p>

          <div class="mt-2 bg-green-50 rounded-2xl p-4 border border-green-200 text-green-700">
            サバイバル
          </div>
        </div>

      </div>
    </div>

  </section>

  <!-- Discord -->
  <section class="max-w-4xl mx-auto px-6 pb-16">

    <div class="bg-gradient-to-r from-indigo-500 to-purple-500 rounded-3xl p-8 text-white shadow-2xl text-center">

      <h2 class="text-4xl font-bold mb-4">
        Discordサーバー
      </h2>

      <p class="text-lg opacity-90 mb-6">
        イベント情報や雑談はDiscordで！
      </p>

      <a
        href="https://discord.gg/G4nG8hmkbA"
        target="_blank"
        class="inline-block bg-white text-purple-600 font-bold text-xl px-8 py-4 rounded-2xl hover:scale-105 transition"
      >
        Discordに参加
      </a>

    </div>

  </section>

  <!-- Rules -->
  <section class="max-w-5xl mx-auto px-6 pb-24">

    <div class="bg-white/70 backdrop-blur-md rounded-3xl p-8 shadow-xl border border-yellow-200">

      <h2 class="text-4xl font-bold text-yellow-500 mb-8 text-center">
        ルール
      </h2>

      <div class="grid md:grid-cols-2 gap-4 text-lg">

        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
          荒らし禁止
        </div>

        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
          チート禁止
        </div>

        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
          迷惑行為禁止
        </div>

        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
          いろんな人を招待してもいいけど掲示板などには書かないで
        </div>

      </div>

    </div>

  </section>


  <!-- Toast -->
  <div
    id="toast"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none"
  >
    コピーしました！
  </div>

  <!-- Copy Script -->
  <script>
    function copyText(id) {
      const text = document.getElementById(id);

      navigator.clipboard.writeText(text.value);

      const toast = document.getElementById("toast");

      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");

      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2000);
    }
  </script>

</body>
</html>
